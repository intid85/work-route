# 한국어판 영주권 경로 (pathways.yaml의 한국어 버전, 한국 제외). 내용을 바꿀 때 영어판과 같이 고치세요.
as_of: "2026년 10월"

countries:
  - code: us
    name: 미국
    pr_name: 영주권(그린카드)
    degree:
      summary: 미국에서 학위를 받고 OPT로 일하다가 H-1B를 받고, 회사가 영주권을 스폰서합니다.
      steps:
        - {label: "F-1 유학", title: "미국 학위", note: "학사 또는 석사"}
        - {label: "OPT", title: "졸업 후 취업", note: "12개월, STEM 전공은 최대 36개월"}
        - {label: "H-1B", title: "전문직 취업비자", note: "매년 추첨, 최대 6년"}
        - {label: "PERM + I-140", title: "회사가 영주권 스폰서", note: "노동허가 후 이민청원"}
        - {label: "영주권", title: "EB-2 또는 EB-3", note: "대기 순번이 오면 발급"}
    no_degree:
      summary: 미국 회사가 한국에 있는 나를 바로 스폰서합니다. 유학이나 취업비자를 먼저 받을 필요가 없습니다.
      steps:
        - {label: "채용 확정", title: "미국 회사가 고용", note: "육가공, 농장, 호텔, 건설 등"}
        - {label: "PERM", title: "노동허가", note: "비용은 회사가 부담해야 함"}
        - {label: "I-140", title: "이민청원", note: "EB-3 숙련공 또는 비숙련"}
        - {label: "대기", title: "비자 블루틴 순번", note: "비숙련은 보통 수년 대기"}
        - {label: "영주권", title: "영주권자로 입국", note: "주한 미국대사관 인터뷰"}
    sources:
      - {name: "미 국무부 비자 블루틴", url: "https://travel.state.gov/content/travel/en/legal/visa-law0/visa-bulletin.html"}
      - {name: "미 노동부 영주권 노동허가", url: "https://www.dol.gov/agencies/eta/foreign-labor/programs/permanent"}

  - code: ca
    name: 캐나다
    pr_name: 영주권
    degree:
      summary: 캐나다에서 졸업하고 졸업 후 취업허가로 1년 이상 일한 뒤 Express Entry로 영주권을 신청합니다.
      steps:
        - {label: "학생 비자", title: "캐나다 학위·디플로마", note: "칼리지 과정은 부족 직종 분야여야 함"}
        - {label: "PGWP", title: "졸업 후 취업허가", note: "과정 길이에 따라 최대 3년"}
        - {label: "경력", title: "숙련직 1년", note: "TEER 0~3 직종"}
        - {label: "Express Entry", title: "캐나다 경력 이민(CEC)", note: "점수나 직종별 추첨으로 초청"}
        - {label: "영주권", title: "영주권", note: ""}
    no_degree:
      summary: 회사의 LMIA로 취업비자를 받아 일한 뒤 주정부 추천을 노립니다. TEER 4·5 직종은 연방 영주권 경로가 사실상 없습니다.
      steps:
        - {label: "LMIA", title: "회사가 고용 승인", note: "비용을 근로자에게 청구할 수 없음"}
        - {label: "취업비자", title: "임시 외국인 근로자", note: "해당 회사에 묶임"}
        - {label: "경력", title: "캐나다 경력 쌓기", note: "TEER 2·3 기술직은 Express Entry 가능"}
        - {label: "PNP", title: "주정부 추천", note: "주마다 지방·부족 직종 프로그램이 다름"}
        - {label: "영주권", title: "영주권", note: ""}
    sources:
      - {name: "캐나다 이민부 졸업 후 취업허가", url: "https://www.canada.ca/en/immigration-refugees-citizenship/services/study-canada/work/after-graduation.html"}
      - {name: "Moving2Canada, TEER 4·5 경로 종료 (2025년 8월)", url: "https://moving2canada.com/news-and-features/news/immigration/canada-closes-teer-4-and-5-permanent-residence-pathway/"}

  - code: uk
    name: 영국
    pr_name: 영주권(ILR)
    degree:
      summary: 영국에서 졸업하고 졸업생 비자로 스폰서 회사에 취업한 뒤, 취업비자로 일정 기간 일해 영주권을 받습니다.
      steps:
        - {label: "학생 비자", title: "영국 학위", note: ""}
        - {label: "졸업생 비자", title: "스폰서 없이 취업", note: "2년(박사 3년), 2027년 1월 1일 신청부터 18개월"}
        - {label: "Skilled Worker", title: "스폰서 회사 취업", note: "학사 수준 직무와 연봉 기준"}
        - {label: "체류 기간", title: "영국 거주·근무", note: "현재 5년, 10년으로 늘리는 안 검토 중"}
        - {label: "영주권", title: "ILR", note: "졸업생 비자 기간은 포함 안 됨"}
    no_degree:
      summary: 2025년 7월 22일부터 신규 취업비자는 대부분 학사 수준 직무만 가능합니다. 학위 없이 가능한 직무는 임시 부족직종 목록뿐입니다.
      steps:
        - {label: "부족직종", title: "임시 부족직종 목록(TSL) 직무", note: "2026년 12월 31일까지 신규 허용"}
        - {label: "Skilled Worker", title: "스폰서 회사 필요", note: "가족 동반 불가"}
        - {label: "체류 기간", title: "영국 거주·근무", note: "영주권 요건 개편 중"}
        - {label: "영주권", title: "ILR", note: "신청 전 최신 규정 확인 필요"}
    sources:
      - {name: "Burness Paull, 임시 부족직종 목록", url: "https://www.burnesspaull.com/legal-insights-news-events/insights/understanding-the-new-skilled-worker-visa-rules-temporary-shortage-list-tsl-and-immigration-salary-list-isl"}
      - {name: "Paragon Law, 졸업생 비자 2026", url: "https://www.paragonlaw.co.uk/resources/uk-graduate-visa-2026-guide"}

  - code: au
    name: 호주
    pr_name: 영주권
    degree:
      summary: 호주에서 졸업하고 졸업생 비자로 일한 뒤, 점수제나 회사 추천으로 영주권을 받습니다.
      steps:
        - {label: "학생 비자", title: "호주 학위", note: ""}
        - {label: "485 비자", title: "졸업생 임시 비자", note: "졸업 후 취업 가능"}
        - {label: "기술 심사", title: "직업 평가와 점수", note: "나이, 영어, 경력, 호주 학업"}
        - {label: "189 / 190 / 186", title: "점수제 또는 회사 추천 영주권", note: "SkillSelect 초청 또는 회사 추천"}
        - {label: "영주권", title: "영주권", note: ""}
    no_degree:
      summary: 기술직을 포함한 여러 직종이 회사 스폰서 취업비자(482)로 갈 수 있고, 같은 회사에서 2년 일하면 회사가 영주권을 추천할 수 있습니다.
      steps:
        - {label: "경력", title: "기술 경력 증명", note: "관련 경력 1년 이상, 일부 기술직은 기술 심사"}
        - {label: "482 비자", title: "Skills in Demand, Core Skills", note: "부족직종 목록 직업, 2026년 7월부터 연봉 A$79,423 이상"}
        - {label: "근무", title: "스폰서 회사에서 근무", note: "풀타임 2년"}
        - {label: "186 비자", title: "회사 추천 영주권", note: "보통 45세 미만"}
        - {label: "영주권", title: "영주권", note: ""}
    sources:
      - {name: "MyVisa, 482 비자 2026 가이드", url: "https://myvisa.com.au/immigration-guides/skills-in-demand-visa-482-australia-guide-2026"}
      - {name: "Magpie, 482에서 186 전환 2026", url: "https://magpieconsultants.com.au/482-visa-to-permanent-residency-ens-186-transition-period-australia-2026/"}
      - {name: "호주 내무부 비자 목록", url: "https://immi.homeaffairs.gov.au/visas/getting-a-visa/visa-listing"}

  - code: sg
    name: 싱가포르
    pr_name: 영주권(PR)
    degree:
      summary: 싱가포르에서 졸업하고 회사 스폰서로 EP나 S Pass를 받은 뒤, 몇 년 일하고 영주권을 신청합니다. 졸업생 취업비자는 없고 영주권은 재량 심사입니다.
      steps:
        - {label: "학생 패스", title: "싱가포르 학위", note: ""}
        - {label: "EP / S Pass", title: "회사 스폰서 취업 패스", note: "최저 월급 기준, EP는 COMPASS 40점도 필요"}
        - {label: "근무", title: "싱가포르 경력 쌓기", note: "급여·근속·가족 관계를 봄"}
        - {label: "PR 신청", title: "이민국(ICA)에 신청", note: "공개된 점수나 최소 연수 없음"}
        - {label: "영주권", title: "영주권", note: ""}
    no_degree:
      summary: 공장·건설·서비스 일자리는 대부분 워크 퍼밋인데, 워크 퍼밋으로는 영주권을 신청할 수 없습니다. S Pass로 올라가야 합니다.
      steps:
        - {label: "워크 퍼밋", title: "회사가 고용", note: "허용 국가만 가능, 한국 포함"}
        - {label: "기술", title: "자격증과 경력 쌓기", note: "자격과 연차가 몸값을 올림"}
        - {label: "S Pass", title: "S Pass로 전환", note: "월급 S$3,300 이상(2027년 1월부터 S$3,600)"}
        - {label: "PR 신청", title: "이민국(ICA)에 신청", note: "워크 퍼밋 소지자는 신청 불가"}
        - {label: "영주권", title: "영주권", note: "재량 심사"}
    sources:
      - {name: "싱가포르 인력부 EP 요건", url: "https://www.mom.gov.sg/passes-and-permits/employment-pass/eligibility"}
      - {name: "싱가포르 인력부 S Pass 요건", url: "https://www.mom.gov.sg/passes-and-permits/s-pass/eligibility"}
      - {name: "싱가포르 인력부 워크 퍼밋 서비스업 규정", url: "https://mom.gov.sg/passes-and-permits/work-permit-for-foreign-worker/sector-specific-rules/services-sector-requirements"}

  - code: jp
    name: 일본
    pr_name: 영주권
    degree:
      summary: 일본에서 공부하고 '기술·인문지식·국제업무' 비자로 일한 뒤 10년 체류로 영주권을 받거나, 고도전문직이면 1~3년 만에 신청할 수 있습니다.
      steps:
        - {label: "유학", title: "일본 학위·전문학교", note: ""}
        - {label: "기술·인문지식·국제업무", title: "전문직 취업비자", note: "전공과 관련된 직무"}
        - {label: "고도전문직(선택)", title: "고도전문직 포인트", note: "70점 이상"}
        - {label: "체류 기간", title: "일본 거주", note: "10년 중 취업비자 5년, 고도전문직은 3년(70점)·1년(80점)"}
        - {label: "영주권", title: "영주권", note: "세금·연금·보험 납부 필수"}
    no_degree:
      summary: 일본어 시험과 기능 시험에 합격해 특정기능 1호로 일하고, 2호로 올라간 뒤 체류 기간을 채워 영주권을 신청합니다. 1호 기간은 취업 5년에 포함되지 않습니다.
      steps:
        - {label: "시험", title: "일본어(N4)·기능 시험", note: "해외나 일본에서 응시"}
        - {label: "특정기능 1호", title: "특정기능 1호", note: "최대 5년, 가족 동반 불가"}
        - {label: "특정기능 2호", title: "특정기능 2호", note: "상위 기능 시험, 기간 제한 없음, 가족 동반 가능"}
        - {label: "체류 기간", title: "일본 거주", note: "10년 중 인정되는 취업비자 5년"}
        - {label: "영주권", title: "영주권", note: ""}
    sources:
      - {name: "출입국재류관리청 특정기능 통계", url: "https://www.moj.go.jp/isa/applications/ssw/nyuukokukanri07_00215.html"}
      - {name: "Office Tree 특정기능 가이드(일본어)", url: "https://office-tree.jp/blog/immigration/tokutei-ginou-guide/"}
      - {name: "Coto Academy 영주권 가이드", url: "https://cotoacademy.com/permanent-resident-visa-japan-apply-guide-explanation-highly-skilled-foreign-professional-point-system/"}
