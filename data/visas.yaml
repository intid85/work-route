        language: {en: "Pass the EPS-TOPIK Korean test"}
        education: {en: "None"}
        experience: {en: "Skills test in some industries"}
        other: {en: "From a country with an EPS agreement; usually aged 18–39; no serious criminal record"}
        stay: {en: "3 years, extendable to 4 years 10 months"}
        next: {en: "E-7-4"}
      - id: e7
