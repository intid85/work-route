# Work Route site configuration
# site.domain: your custom domain (e.g. workroute.com). Leave empty until DNS is set up; a CNAME file is generated when set.
# site.google_site_verification: the content value of the Google Search Console HTML tag.
# site.adsense_client: ca-pub-XXXXXXXX once AdSense is approved.
# jobs[].jp_fields: Japan Specified Skilled Worker fields; jobs[].sg_pass: the Singapore pass this job usually uses.
# *_ko fields are used by the Korean edition under /ko/.
# site.consult_url: affiliate link for an immigration lawyer or agency. The consult box is hidden when empty.
# majors[].soc / jobs[].soc: 2018 SOC codes. jobs[].noc: Canada NOC 2021 code. jobs[].anzsco: Australian ANZSCO unit groups (or exact labels) for the same job.
site:
  name: Work Route
  tagline: Government data on the jobs, employers and waiting times behind work visas and permanent residence in the US, Canada, the UK and Korea.
  domain: ''
  base_url: https://intid85.github.io/work-route
  google_site_verification: ''
  adsense_client: ''
