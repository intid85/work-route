# Work Route site configuration
# site.domain: your custom domain (e.g. workroute.com). Leave empty until DNS is set up; a CNAME file is generated when set.
# site.google_site_verification: the content value of the Google Search Console HTML tag.
# site.adsense_client: ca-pub-XXXXXXXX once AdSense is approved.
# site.consult_url: affiliate link for an immigration lawyer or agency. The consult box is hidden when empty.
# majors[].soc / jobs[].soc: 2018 SOC codes. jobs[].noc: Canada NOC 2021 code. jobs[].anzsco: Australian ANZSCO unit groups (or exact labels) for the same job.
site:
  name: Work Route
  tagline: Government data on the jobs, employers and waiting times behind work visas and permanent residence in the US, Canada, the UK and Korea.
  domain: ''
  base_url: https://intid85.github.io/work-route
  google_site_verification: ''
  adsense_client: ''
  consult_url: ''
sources:
  dol_base: https://www.dol.gov/sites/dolgov/files/ETA/oflc/pdfs/
  lca_pattern: LCA_Disclosure_Data_FY{fy}_Q{q}.xlsx
  perm_pattern: PERM_Disclosure_Data_FY{fy}_Q{q}.xlsx
  visa_bulletin_pattern: https://travel.state.gov/content/travel/en/legal/visa-law0/visa-bulletin/{fy}/visa-bulletin-for-{month}-{year}.html
  ca_lmia_package: https://open.canada.ca/data/api/3/action/package_show?id=90fed587-1364-4f33-a9ee-208181dc0b97
  ca_ee_rounds: https://www.canada.ca/content/dam/ircc/documents/json/ee_rounds_123_en.json
  uk_sponsor_api: https://www.gov.uk/api/content/government/publications/register-of-licensed-sponsors-workers
  scorecard_fos_zip: https://ed-public-download.scorecard.network/downloads/Most-Recent-Cohorts-Field-of-Study_10152026.zip
  au_package: https://data.gov.au/data/api/3/action/package_show?id=visa-temporary-work-skilled
