name: 데이터 갱신과 배포

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 5 * *"   # 매월 5일 12:17 (한국시간)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # 원본 파일(수백 MB)은 캐시해 두고 바뀐 분기만 새로 받습니다
      - uses: actions/cache@v4
        with:
          path: raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      - name: 미국 데이터 수집
        id: fetch
        continue-on-error: true
        run: python scripts/fetch_data.py

      - name: 캐나다·영국 데이터 수집
        id: fetch_world
        continue-on-error: true
        run: python scripts/fetch_world.py

      - name: 갱신된 요약 데이터 저장
        if: steps.fetch.outcome == 'success' || steps.fetch_world.outcome == 'success'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/live
          if ! git diff --cached --quiet; then
            git commit -m "데이터 갱신 $(date +%F)"
            git push
          fi

      - name: 수집 실패 알림
        if: steps.fetch.outcome != 'success' || steps.fetch_world.outcome != 'success'
        run: echo "::warning::일부 데이터 수집에 실패해 이전 데이터로 빌드합니다. 로그를 확인하세요."

      - name: 사이트 빌드
        run: python scripts/build_site.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
