name: 데이터 갱신과 배포

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 5 * *"   # 매월 5일 12:17 (한국시간): 데이터 갱신 + 배포
    - cron: "41 18 * * *"  # 매일 03:41 (한국시간): 커뮤니티 글 정적 페이지만 다시 빌드
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # 원본 파일(수백 MB)은 캐시해 두고 바뀐 분기만 새로 받습니다
      - uses: actions/cache@v4
        with:
          path: raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      - name: 미국 데이터 수집
        id: fetch
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 3 5 * *'
        continue-on-error: true
        run: python scripts/fetch_data.py

      - name: 캐나다·영국 데이터 수집
        id: fetch_world
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 3 5 * *'
        continue-on-error: true
        run: python scripts/fetch_world.py

      - name: 갱신된 요약 데이터 저장
        if: steps.fetch.outcome == 'success' || steps.fetch_world.outcome == 'success'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/live
          if ! git diff --cached --quiet; then
            git commit -m "데이터 갱신 $(date +%F)"
            git push
          fi

      - name: 수집 실패 알림
        if: (steps.fetch.outcome == 'failure' || steps.fetch_world.outcome == 'failure')
        run: echo "::warning::일부 데이터 수집에 실패해 이전 데이터로 빌드합니다. 로그를 확인하세요."

      - name: 네이버 블로그 후기 수집
        continue-on-error: true
        run: python scripts/fetch_blogs.py

      - name: 사이트 빌드
        run: python scripts/build_site.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # Cloudflare Pages: 저장소 Settings → Secrets에 CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID를 넣으면 자동으로 함께 배포됩니다
      - name: Cloudflare Pages 배포
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          npx --yes wrangler@3 pages project create work-route --production-branch=main 2>/dev/null || true
          npx --yes wrangler@3 pages deploy site --project-name=work-route --branch=main --commit-dirty=true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
